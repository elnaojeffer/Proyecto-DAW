<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bitacora - Sistema de Practicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="menu" id="menu"></aside>
    <main class="contenido">
      <h1>Bitacora de acciones</h1>
      <div class="barra">
        <select id="f-accion"><option value="">Todas las acciones</option></select>
        <input type="text" id="f-texto" placeholder="Usuario o detalle">
      </div>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Fecha</th><th>Usuario</th><th>Accion</th><th>Detalle</th></tr></thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/bitacora.js"></script>
</body>
</html>
