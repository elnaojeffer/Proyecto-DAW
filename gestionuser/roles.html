<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roles y permisos - Sistema de Practicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="menu" id="menu"></aside>
    <main class="contenido">
      <h1>Roles y permisos</h1>
      <div id="avisos"></div>
      <div class="barra">
        <button class="btn" id="btn-nuevo" type="button">Nuevo rol</button>
      </div>
      <div class="tabla-wrap">
        <table>
          <thead><tr><th>Rol</th><th>Descripcion</th><th>Usuarios</th><th></th></tr></thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>
    </main>
  </div>

  <dialog id="dlg-rol" style="width:min(720px,94vw)">
    <h2 id="dlg-titulo">Nuevo rol</h2>
    <div id="form-errores"></div>
    <form id="form-rol" novalidate>
      <input type="hidden" id="f-id">
      <label for="f-nombre">Nombre</label>
      <input type="text" id="f-nombre">
      <label for="f-desc">Descripcion</label>
      <input type="text" id="f-desc">
      <label>Permisos por modulo</label>
      <div class="tabla-wrap">
        <table class="matriz" id="matriz"></table>
      </div>
      <div class="acciones-form">
        <button type="button" class="btn gris" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="btn">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/roles.js"></script>
</body>
</html>
