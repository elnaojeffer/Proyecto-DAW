<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesion - Sistema de Practicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="centrado">
    <h1>Iniciar sesion</h1>
    <div id="avisos"></div>
    <form id="form-login">
      <label for="email">Correo</label>
      <input type="email" id="email" required autofocus>
      <label for="clave">Contrasena</label>
      <input type="password" id="clave" required>
      <p><button class="btn" type="submit">Entrar</button></p>
      <p><a href="recuperar.html">Olvide mi contrasena</a></p>
    </form>
    <div class="demo">
      <div class="demo-titulo">Cuenta de prueba</div>
      <div>Correo: <code>admin@practicas.local</code></div>
      <div>Contrasena: <code>Admin12345</code></div>
      <button type="button" class="btn gris chico" id="btn-demo">Usar datos de prueba</button>
    </div>
  </main>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
