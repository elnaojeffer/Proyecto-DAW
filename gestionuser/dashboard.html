<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Inicio - Sistema de Practicas</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="layout">
    <aside class="menu" id="menu"></aside>
    <main class="contenido">
      <h1>Inicio</h1>
      <p id="saludo"></p>
      <p>Usa el menu de la izquierda para acceder a los modulos disponibles segun tu rol.</p>
    </main>
  </div>
  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script>
    (async function () {
      await initDB();
      if (!requiereLogin()) return;
      pintarMenu();
      const s = sesion();
      document.getElementById('saludo').innerHTML = 'Bienvenido, <strong>' + esc(s.nombre) + '</strong> (' + esc(s.rol) + ').';
    })();
  </script>
</body>
</html>
