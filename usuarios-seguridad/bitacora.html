<!DOCTYPE html>
<html lang="es">
<head>

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/usuarios.css">
</head>
<body>
  <header class="encabezado">
    <h1>Gestión de Prácticas Preprofesionales</h1>

  <nav class="menu">

  <main class="contenido">
    <p class="sesion" id="sesion"></p>
    <nav class="pestanas" id="menu"></nav>
    <section class="tarjeta">
      <h2>Bitacora de acciones</h2>
      <div class="barra">
        <select id="f-accion"><option value="">Todas las acciones</option></select>
        <input type="text" id="f-texto" placeholder="Usuario o detalle">

      <div class="tabla-contenedor">
        <table>
          <thead><tr><th>Fecha</th><th>Usuario</th><th>Accion</th><th>Detalle</th></tr></thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>
