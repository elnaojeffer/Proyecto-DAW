<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roles y permisos - Sistema de Practicas</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="css/usuarios.css">
</head>
<body>
  <header class="encabezado">
    <h1>Gestión de Prácticas Preprofesionales</h1>
    <p>Módulo: Gestión de usuarios y seguridad</p>
  </header>

  <nav class="menu">
    <ul>
      <li><a href="../index.html">Inicio</a></li>
      <li><a href="index.html" class="activo">Usuarios</a></li>
      <li><a href="../empresas-convenios/index.html">Empresas</a></li>
      <li><a href="../estudiantes-postulaciones/index.html">Estudiantes</a></li>
      <li><a href="../asignacion-tutores/index.html">Asignaciones</a></li>
      <li><a href="#">Horas</a></li>
      <li><a href="../reportes-validacion/index.html">Reportes</a></li>
    </ul>
  </nav>

  <main class="contenido">
    <nav class="submenu" id="menu"></nav>
    <section class="tarjeta">
      <h2>Roles y permisos</h2>
      <div id="avisos"></div>
      <div class="barra">
        <button class="boton" id="btn-nuevo" type="button">Nuevo rol</button>
      </div>
      <div class="tabla-contenedor">
        <table>
          <thead><tr><th>Rol</th><th>Descripcion</th><th>Usuarios</th><th></th></tr></thead>
          <tbody id="tabla-cuerpo"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer class="pie">
    <p>© 2026 Grupo G05 · Mathew Alexis Ruiz Veliz</p>
  </footer>

  <dialog id="dlg-rol" style="width:min(720px,94vw)">
    <h2 id="dlg-titulo">Nuevo rol</h2>
    <div id="form-errores"></div>
    <form id="form-rol" novalidate>
      <input type="hidden" id="f-id">
      <label for="f-nombre">Nombre</label>
      <input type="text" id="f-nombre">
      <label for="f-desc">Descripcion</label>
      <input type="text" id="f-desc">
      <label>Permisos por modulo</label>
      <div class="tabla-contenedor">
        <table class="matriz" id="matriz"></table>
      </div>
      <div class="acciones">
        <button type="button" class="boton secundario" id="btn-cancelar">Cancelar</button>
        <button type="submit" class="boton">Guardar</button>
      </div>
    </form>
  </dialog>

  <script src="js/storage.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/roles.js"></script>
</body>
</html>
