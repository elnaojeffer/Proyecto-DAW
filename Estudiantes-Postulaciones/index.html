<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GPP - Estudiantes y postulaciones</title>
    <style>
        :root {
            --navy: #173a66;
            --blue: #2d67a5;
            --blue-light: #eef4fb;
            --ink: #1d2a3a;
            --muted: #66758a;
            --line: #dde5ef;
            --green: #16865d;
            --orange: #bd7a1d;
            --red: #c44d58;
            --white: #ffffff;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--ink);
            background: #f4f7fb;
        }

        .app {
            min-height: 100vh;
            display: grid;
            grid-template-columns: 230px 1fr;
        }

        .sidebar {
            background: var(--navy);
            color: var(--white);
            padding: 22px 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 0 8px 28px;
            font-size: 20px;
            font-weight: 700;
        }

        .brand-mark {
            width: 38px;
            height: 38px;
            display: grid;
            place-items: center;
            border: 2px solid rgba(255,255,255,.75);
            border-radius: 8px;
        }

        .nav-label {
            margin: 14px 10px 7px;
            color: #b9c9dc;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .8px;
        }

        .nav-item {
            width: 100%;
            border: 0;
            background: transparent;
            color: #dbe7f5;
            padding: 11px 12px;
            margin: 2px 0;
            border-radius: 7px;
            text-align: left;
            cursor: pointer;
        }

        .nav-item.active, .nav-item:hover {
            background: rgba(255,255,255,.13);
            color: #fff;
        }

        .main { min-width: 0; }

        .topbar {
            height: 68px;
            background: var(--white);
            border-bottom: 1px solid var(--line);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
        }

        .topbar h1 {
            margin: 0;
            font-size: 21px;
        }

        .profile {
            color: var(--muted);
            font-size: 14px;
        }

        .content { padding: 26px 30px 40px; }

        .stats {
            display: grid;
            grid-template-columns: repeat(4, minmax(150px, 1fr));
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 9px;
            padding: 16px 18px;
        }

        .stat-card span {
            color: var(--muted);
            font-size: 13px;
        }

        .stat-card strong {
            display: block;
            margin-top: 7px;
            font-size: 27px;
        }

        .panel {
            background: var(--white);
            border: 1px solid var(--line);
            border-radius: 9px;
            overflow: hidden;
        }

        .panel-header {
            min-height: 68px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 14px 18px;
            border-bottom: 1px solid var(--line);
        }

        .tabs {
            display: flex;
            gap: 5px;
        }

        .tab {
            border: 0;
            background: transparent;
            color: var(--muted);
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab.active {
            background: var(--blue-light);
            color: var(--blue);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .search {
            width: 220px;
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 12px;
        }

        button {
            font: inherit;
        }

        .btn {
            height: 38px;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--white);
            color: var(--ink);
            padding: 0 13px;
            cursor: pointer;
        }

        .btn-primary {
            border-color: var(--blue);
            background: var(--blue);
            color: var(--white);
        }

        .btn-danger {
            color: var(--red);
        }

        .table-wrap { overflow-x: auto; }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 13px 18px;
            border-bottom: 1px solid #edf1f6;
            text-align: left;
            white-space: nowrap;
        }

        th {
            color: var(--muted);
            background: #fafcff;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: .4px;
        }

        td { font-size: 14px; }

        .status {
            display: inline-block;
            border-radius: 20px;
            padding: 5px 9px;
            font-size: 12px;
            font-weight: 700;
        }

        .status.aprobada, .status.activo { background: #dff4e9; color: var(--green); }
        .status.pendiente { background: #fff1d6; color: var(--orange); }
        .status.rechazada, .status.inactivo { background: #fae6e8; color: var(--red); }

        .row-actions { display: flex; gap: 5px; }

        .icon-btn {
            width: 32px;
            height: 32px;
            border: 1px solid var(--line);
            border-radius: 5px;
            background: var(--white);
            cursor: pointer;
        }

        .modal-backdrop {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: none;
            align-items: center;
            justify-content: center;
            background: rgba(16,31,50,.45);
            padding: 20px;
        }

        .modal-backdrop.open { display: flex; }

        .modal {
            width: min(560px, 100%);
            background: var(--white);
            border-radius: 10px;
            box-shadow: 0 18px 50px rgba(22,45,75,.25);
        }

        .modal-header, .modal-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            border-bottom: 1px solid var(--line);
        }

        .modal-footer {
            justify-content: flex-end;
            gap: 8px;
            border-top: 1px solid var(--line);
            border-bottom: 0;
        }

        .modal-header h2 { margin: 0; font-size: 18px; }

        .close {
            border: 0;
            background: transparent;
            color: var(--muted);
            font-size: 24px;
            cursor: pointer;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            padding: 20px;
        }

        .field { display: grid; gap: 7px; }
        .field.full { grid-column: 1 / -1; }
        .field label { font-size: 13px; font-weight: 700; }
        .field input, .field select {
            height: 40px;
            border: 1px solid var(--line);
            border-radius: 6px;
            padding: 0 10px;
            font: inherit;
        }

        .empty {
            padding: 40px;
            text-align: center;
            color: var(--muted);
        }

        @media (max-width: 900px) {
            .app { grid-template-columns: 74px 1fr; }
            .brand { justify-content: center; margin-inline: 0; }
            .brand span:last-child, .nav-label, .nav-item span { display: none; }
            .nav-item { text-align: center; }
            .stats { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 650px) {
            .app { display: block; }
            .sidebar { display: none; }
            .topbar { height: 58px; padding: 0 16px; }
            .topbar h1 { font-size: 17px; }
            .content { padding: 16px; }
            .stats { grid-template-columns: 1fr 1fr; }
            .panel-header { align-items: stretch; flex-direction: column; }
            .actions { width: 100%; }
            .search { width: 100%; }
            .form-grid { grid-template-columns: 1fr; }
            .field.full { grid-column: auto; }
        }
    </style>
</head>
<body>
    <div class="app">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">G</div>
                <span>GPP</span>
            </div>
            <div class="nav-label">Portal</div>
            <button class="nav-item"><span>Inicio</span></button>
            <button class="nav-item active"><span>Estudiantes</span></button>
            <button class="nav-item"><span>Postulaciones</span></button>
            <div class="nav-label">Administración</div>
            <button class="nav-item"><span>Carreras</span></button>
            <button class="nav-item"><span>Periodos académicos</span></button>
            <button class="nav-item"><span>Configuración</span></button>
        </aside>

        <main class="main">
            <header class="topbar">
                <h1>Gestión de estudiantes y postulaciones</h1>
                <span class="profile">Administrador</span>
            </header>

            <div class="content">
                <section class="stats" aria-label="Resumen">
                    <div class="stat-card"><span>Estudiantes activos</span><strong id="activeCount">0</strong></div>
                    <div class="stat-card"><span>Postulaciones</span><strong id="applicationCount">0</strong></div>
                    <div class="stat-card"><span>Pendientes</span><strong id="pendingCount">0</strong></div>
                    <div class="stat-card"><span>Periodo actual</span><strong id="periodName">2026-1</strong></div>
                </section>

                <section class="panel">
                    <div class="panel-header">
                        <div class="tabs" role="tablist">
                            <button class="tab active" data-view="students">Estudiantes</button>
                            <button class="tab" data-view="applications">Postulaciones</button>
                        </div>
                        <div class="actions">
                            <input id="search" class="search" type="search" placeholder="Buscar..." aria-label="Buscar">
                            <button id="newButton" class="btn btn-primary">+ Nuevo estudiante</button>
                        </div>
                    </div>
                    <div class="table-wrap">
                        <table>
                            <thead id="tableHead"></thead>
                            <tbody id="tableBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Nuevo estudiante</h2>
                <button class="close" type="button" aria-label="Cerrar">&times;</button>
            </div>
            <form id="entityForm">
                <div id="formFields" class="form-grid"></div>
                <div class="modal-footer">
                    <button class="btn close-cancel" type="button">Cancelar</button>
                    <button class="btn btn-primary" type="submit">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        const state = {
            view: "students",
            editingId: null,
            students: [
                { id: 1, nombre: "María González", cedula: "V-30.845.221", carrera: "Ingeniería Informática", periodo: "2026-1", estado: "Activo" },
                { id: 2, nombre: "Carlos Pérez", cedula: "V-28.193.507", carrera: "Administración", periodo: "2026-1", estado: "Activo" },
                { id: 3, nombre: "Ana Rodríguez", cedula: "V-31.442.905", carrera: "Contaduría Pública", periodo: "2025-2", estado: "Inactivo" },
                { id: 4, nombre: "Luis Martínez", cedula: "V-27.630.184", carrera: "Ingeniería Civil", periodo: "2026-1", estado: "Activo" }
            ],
            applications: [
                { id: 101, estudiante: "María González", carrera: "Ingeniería Informática", practica: "Desarrollo de software", fecha: "20/11/2026", estado: "Aprobada" },
                { id: 102, estudiante: "Carlos Pérez", carrera: "Administración", practica: "Gestión empresarial", fecha: "22/11/2026", estado: "Pendiente" },
                { id: 103, estudiante: "Luis Martínez", carrera: "Ingeniería Civil", practica: "Inspección estructural", fecha: "24/11/2026", estado: "Pendiente" }
            ]
        };

        const modal = document.getElementById("modal");
        const form = document.getElementById("entityForm");
        const formFields = document.getElementById("formFields");
        const tableHead = document.getElementById("tableHead");
        const tableBody = document.getElementById("tableBody");
        const searchInput = document.getElementById("search");
        const newButton = document.getElementById("newButton");

        function updateStats() {
            document.getElementById("activeCount").textContent = state.students.filter(s => s.estado === "Activo").length;
            document.getElementById("applicationCount").textContent = state.applications.length;
            document.getElementById("pendingCount").textContent = state.applications.filter(a => a.estado === "Pendiente").length;
        }

        function escapeHtml(value) {
            const div = document.createElement("div");
            div.textContent = value;
            return div.innerHTML;
        }

        function render() {
            const query = searchInput.value.trim().toLowerCase();
            if (state.view === "students") {
                tableHead.innerHTML = "<tr><th>Estudiante</th><th>Cédula</th><th>Carrera</th><th>Periodo</th><th>Estado</th><th>Acciones</th></tr>";
                const rows = state.students.filter(s => Object.values(s).join(" ").toLowerCase().includes(query));
                tableBody.innerHTML = rows.length ? rows.map(s => `
                    <tr>
                        <td><strong>${escapeHtml(s.nombre)}</strong></td>
                        <td>${escapeHtml(s.cedula)}</td>
                        <td>${escapeHtml(s.carrera)}</td>
                        <td>${escapeHtml(s.periodo)}</td>
                        <td><span class="status ${s.estado.toLowerCase()}">${escapeHtml(s.estado)}</span></td>
                        <td><div class="row-actions">
                            <button class="icon-btn" title="Editar" onclick="editStudent(${s.id})">&#9998;</button>
                            <button class="icon-btn btn-danger" title="Eliminar" onclick="deleteStudent(${s.id})">&#128465;</button>
                        </div></td>
                    </tr>`).join("") : '<tr><td colspan="6" class="empty">No se encontraron estudiantes</td></tr>';
            } else {
                tableHead.innerHTML = "<tr><th>Estudiante</th><th>Carrera</th><th>Práctica</th><th>Fecha</th><th>Estado</th><th>Acciones</th></tr>";
                const rows = state.applications.filter(a => Object.values(a).join(" ").toLowerCase().includes(query));
                tableBody.innerHTML = rows.length ? rows.map(a => `
                    <tr>
                        <td><strong>${escapeHtml(a.estudiante)}</strong></td>
                        <td>${escapeHtml(a.carrera)}</td>
                        <td>${escapeHtml(a.practica)}</td>
                        <td>${escapeHtml(a.fecha)}</td>
                        <td><span class="status ${a.estado.toLowerCase()}">${escapeHtml(a.estado)}</span></td>
                        <td><div class="row-actions">
                            ${a.estado === "Pendiente" ? `
                                <button class="icon-btn" title="Aprobar" onclick="approveApplication(${a.id})">&#10003;</button>
                                <button class="icon-btn btn-danger" title="Rechazar" onclick="rejectApplication(${a.id})">&#10005;</button>` : `
                                <button class="icon-btn btn-danger" title="Eliminar" onclick="deleteApplication(${a.id})">&#128465;</button>`}
                        </div></td>
                    </tr>`).join("") : '<tr><td colspan="6" class="empty">No se encontraron postulaciones</td></tr>';
            }
            updateStats();
        }

        function openModal(title, fields, values = {}) {
            document.getElementById("modalTitle").textContent = title;
            formFields.innerHTML = fields.map(field => `
                <div class="field ${field.full ? "full" : ""}">
                    <label for="${field.name}">${field.label}</label>
                    ${field.options ? `
                        <select id="${field.name}" name="${field.name}" required>
                            ${field.options.map(option => `<option ${values[field.name] === option ? "selected" : ""}>${escapeHtml(option)}</option>`).join("")}
                        </select>` : `
                        <input id="${field.name}" name="${field.name}" value="${escapeHtml(values[field.name] || "")}" required ${field.type ? `type="${field.type}"` : ""}>`}
                </div>`).join("");
            modal.classList.add("open");
        }

        function closeModal() {
            modal.classList.remove("open");
            state.editingId = null;
            form.reset();
        }

        function openStudentModal(student = null) {
            state.editingId = student ? student.id : null;
            openModal(
                student ? "Modificar estudiante" : "Nuevo estudiante",
                [
                    { name: "nombre", label: "Nombre completo", full: true },
                    { name: "cedula", label: "Cédula" },
                    { name: "carrera", label: "Carrera", options: ["Ingeniería Informática", "Ingeniería Civil", "Administración", "Contaduría Pública"] },
                    { name: "periodo", label: "Periodo académico", options: ["2026-1", "2025-2"] },
                    { name: "estado", label: "Estado", options: ["Activo", "Inactivo"] }
                ],
                student
            );
        }

        window.editStudent = function(id) {
            openStudentModal(state.students.find(s => s.id === id));
        };

        window.deleteStudent = function(id) {
            if (confirm("¿Eliminar este estudiante?")) {
                state.students = state.students.filter(s => s.id !== id);
                render();
            }
        };

        window.approveApplication = function(id) {
            state.applications.find(a => a.id === id).estado = "Aprobada";
            render();
        };

        window.rejectApplication = function(id) {
            state.applications.find(a => a.id === id).estado = "Rechazada";
            render();
        };

        window.deleteApplication = function(id) {
            if (confirm("¿Eliminar esta postulación?")) {
                state.applications = state.applications.filter(a => a.id !== id);
                render();
            }
        };

        document.querySelectorAll(".tab").forEach(tab => {
            tab.addEventListener("click", () => {
                document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
                tab.classList.add("active");
                state.view = tab.dataset.view;
                newButton.textContent = state.view === "students" ? "+ Nuevo estudiante" : "+ Nueva postulación";
                searchInput.value = "";
                render();
            });
        });

        newButton.addEventListener("click", () => {
            if (state.view === "students") {
                openStudentModal();
            } else {
                state.editingId = null;
                openModal(
                    "Nueva postulación",
                    [
                        { name: "estudiante", label: "Estudiante", full: true },
                        { name: "carrera", label: "Carrera", options: ["Ingeniería Informática", "Ingeniería Civil", "Administración", "Contaduría Pública"] },
                        { name: "practica", label: "Práctica", full: true },
                        { name: "fecha", label: "Fecha", type: "date" },
                        { name: "estado", label: "Estado", options: ["Pendiente", "Aprobada", "Rechazada"] }
                    ]
                );
            }
        });

        form.addEventListener("submit", event => {
            event.preventDefault();
            const data = Object.fromEntries(new FormData(form).entries());
            if (state.view === "students") {
                if (state.editingId) {
                    Object.assign(state.students.find(s => s.id === state.editingId), data);
                } else {
                    state.students.unshift({ id: Date.now(), cedula: data.cedula, nombre: data.nombre, carrera: data.carrera, periodo: data.periodo, estado: data.estado });
                }
            } else {
                data.fecha = data.fecha ? new Date(`${data.fecha}T00:00:00`).toLocaleDateString("es-VE") : "";
                state.applications.unshift({ id: Date.now(), ...data });
            }
            closeModal();
            render();
        });

        document.querySelectorAll(".close, .close-cancel").forEach(button => button.addEventListener("click", closeModal));
        modal.addEventListener("click", event => { if (event.target === modal) closeModal(); });
        searchInput.addEventListener("input", render);

        render();
    </script>
</body>
</html>
